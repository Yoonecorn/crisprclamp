[package]
name = "crisprclamp"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Yoon Sing Yap"]
repository = "https://github.com/Yoonecorn/crisprclamp"
publish = false
autobins = false


[dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
serde_json = "=1.0.151"
sha2 = "=0.10.8"

[profile.release]
lto = "thin"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "=0.33.0"

[[bin]]
name = "crisprclamp"
path = "src/main.rs"
